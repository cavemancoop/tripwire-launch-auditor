name: Tripwire external feed monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripwire-external-feed-monitor
  cancel-in-progress: false

jobs:
  check-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check monitor logic
        run: python3 -m unittest discover -s scripts/tests -p test_external_feed_monitor.py
      - name: Check public feed metrics
        run: python3 scripts/external_feed_monitor.py
